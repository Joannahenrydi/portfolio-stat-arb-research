[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-stat-arb-research"
version = "0.1.0"
description = "Cost-aware, market-neutral portfolio statistical-arbitrage research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scipy>=1.10,<2",
  "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.8,<4"]
data = ["yfinance>=0.2.54,<2"]
alpaca = ["alpaca-py>=0.42,<1"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
market-neutral-shadow = "live.generate_shadow:cli"
market-neutral-paper = "live.run_paper:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "features*", "models*", "portfolio*", "execution*", "risk*", "backtest*", "live*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
